# chainiam-private-ai backend in Docker (DOCKERIZE-PLAN.md). Start it with test-console\up.ps1, not by hand: up.ps1 reads
# the secrets from C:\PRIV-AI-SECRETS through the same allowlists stack.ps1 uses, puts only those names in its own
# process environment (nothing is written to a file), writes runtime\compose\commands.yml (the gateway's current
# command and the console's paid-job flags, no secrets) and runs:
#   docker compose -f docker-compose.yml -f runtime/compose/commands.yml up -d
# The 8730 UI stays on the PC: node test-console/console/server.ts --mode ui --api http://127.0.0.1:8735 (up.ps1 starts it).
#
# Container names, the network and its aliases, the ledger volume and the host ports are the ones stack.ps1 and
# switch-models.ps1 use today, so stack.ps1 -Check still recognises them and the old and new way cannot both run.
# Every port is published on 127.0.0.1 only. Secrets are listed here by NAME only (taken from up.ps1's environment);
# never run "docker compose config" or "docker inspect" where others can read the output: both print the values.
name: chainaim-private-ai

x-source: &source
  chainaim.source: ${CHAINAIM_SOURCE:-unknown}
  chainaim.managed-by: docker-compose

networks:
  chainaim-test:
    external: true

volumes:
  chainaim-test-ledger:
    external: true
  chainaim-analyst-work:
  chainaim-console-runs:
  # Signed Job Evidence Receipts (privateAI-design-32 ARCH-615): kept across restarts so a buyer can fetch one later.
  chainaim-console-receipts:
  # The agent's daily spend ledger (privateAI-design-32 ARCH-620): job ids, amounts and transactions per tenant per UTC
  # day, kept across restarts so a restart cannot reset a tenant's daily cap.
  chainaim-agent-spend:

secrets:
  gateway-key:
    file: ./test-console/local-gateway-key.txt

services:
  presidio:
    build: { context: services/presidio, labels: *source }
    image: chainaim-presidio:test
    container_name: ca-presidio
    labels: *source
    networks: { chainaim-test: { aliases: [presidio.railway.internal] } }
    restart: "no"
    # Start order (owner run 2026-11-07): gunicorn listens before its worker has loaded the language models, and the
    # gateway gives up after its 120 s wait. /health answers only once the analyzer app (and its models) is loaded, so the
    # gateway below starts only when this is healthy. Python is in the image; no extra tool is added.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 60
      start_period: 60s

  openrouter-stub:
    profiles: [test]
    image: node:24-slim
    container_name: ca-openrouter-stub
    labels: *source
    command: ["node", "/spy/spy-openrouter.ts"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./test-console/spy:/spy:ro
    ports: ["127.0.0.1:5004:5004"]
    networks: { chainaim-test: { aliases: [openrouter-stub] } }

  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile, labels: *source }
    image: chainaim-gateway:test
    container_name: ca-gateway
    labels: *source
    # The image's default command; up.ps1 puts the gateway's CURRENT mode command (from the running ca-gateway, as
    # switch-models.ps1 built it) in runtime/compose/commands.yml.
    environment:
      - CHAINAIM_GATEWAY_KEY
      - OPENROUTER_API_KEY
      - BEDROCK_API_KEY
      # Only the ollama-cpu-8gb-all-nearai mode uses it (PLAN-private-ai-nearai-attestation.md ARCH-403); unset = not passed.
      - NEARAI_API_KEY
    volumes:
      - chainaim-test-ledger:/data
      - ./config:/config:ro
    ports: ["127.0.0.1:8720:8700"]
    networks: { chainaim-test: { aliases: [gateway.railway.internal] } }
    # Starts only once Presidio answers /health; if its own Presidio wait still times out it exits, and Docker starts it again.
    depends_on:
      presidio: { condition: service_healthy }
    restart: on-failure:3

  paywall:
    build: { context: services/paywall, labels: *source }
    image: chainaim-paywall:test
    container_name: ca-paywall
    labels: *source
    environment:
      - XRPL_NETWORK
      - XRPL_PAY_TO_TESTNET
      - XRPL_PAY_TO_MAINNET
      - RLUSD_ISSUER_TESTNET
      - RLUSD_ISSUER_MAINNET
      - FACILITATOR_URL_TESTNET
      - FACILITATOR_URL_MAINNET
      - PRICE_SCAN
      - PRICE_MASK
      - PRICE_CHAT
      - PUBLIC_BASE_URL
      - GATEWAY_URL=http://gateway.railway.internal:8700
      - CHAINAIM_GATEWAY_KEY
      - PAY_RAILS
      - NEAR_NETWORK
      - NEAR_MAX_GAS
      - NEAR_PAY_TO_TESTNET
      - NEAR_USDC_CONTRACT_TESTNET
      - NEAR_USDC_DECIMALS_TESTNET
      - NEAR_RPC_URL_TESTNET
      - NEAR_RPC_FALLBACK_URL_TESTNET
      - NEAR_FACILITATOR_URL_TESTNET
      - NEAR_RELAYER_ACCOUNT_TESTNET
      - NEAR_RELAYER_KEY_TESTNET
      - NEAR_PAY_TO_MAINNET
      - NEAR_USDC_CONTRACT_MAINNET
      - NEAR_USDC_DECIMALS_MAINNET
      - NEAR_RPC_URL_MAINNET
      - NEAR_RPC_FALLBACK_URL_MAINNET
      - NEAR_FACILITATOR_URL_MAINNET
      - NEAR_RELAYER_ACCOUNT_MAINNET
      - NEAR_RELAYER_KEY_MAINNET
      - PAID_JOBS
      - PAID_JOBS_KEY
      # The console is in this compose file, so the paywall reaches its internal listener by service name.
      - PAID_JOBS_RESULT_URL=http://console-api:8731
      - PAID_JOBS_TTL_SEC
      - PAID_JOBS_MAX
      # privateAI-design-37, set by up.ps1 only with -PaidFlow upfront (unset = authorization, as before): the signer that
      # refunds a refused job, and the request key under its own name (PAYWALL_SIGNER_KEY, named by PAID_JOBS_REFUND_KEY_ENV).
      - PAID_JOBS_FLOW
      # privateAI-design-39: set by up.ps1 only with -PayOnlyAttested verified (the run step then waits for ca-attest).
      - PAID_JOBS_RUN_TIMEOUT_SEC
      - PAID_JOBS_REFUND_URL
      - PAID_JOBS_REFUND_KEY_ENV
      - PAYWALL_SIGNER_KEY
      - PAYMENT_LOG_URL
      - PAYMENT_LOG_KEY
    # ca-control-signer is published on the host (127.0.0.1:8780) from its own project: the upfront refunds reach it here.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080"]
    networks: [chainaim-test]
    depends_on: [gateway]

  analyst:
    build: { context: ., dockerfile: services/analyst/Dockerfile, labels: *source }
    image: chainaim-analyst:local
    container_name: ca-analyst
    labels: *source
    volumes:
      - ./config:/app/config:ro
      - ${SAMPLE_DATA_DIR:-./sample-data}:/app/sample-data:ro
      - ${PRIV_AI_DATA_DIR:-C:/PRIV-AI-DATA}:/data/priv-ai-data:ro
      - chainaim-analyst-work:/work
    ports: ["127.0.0.1:8740:8740"]
    networks: [chainaim-test]

  chain-query:
    build: { context: ., dockerfile: services/chain-query/Dockerfile, labels: *source }
    image: chainaim-chain-query:local
    container_name: ca-chain-query
    labels: *source
    volumes:
      - ./config/chains:/app/config/chains:ro
      - ./config/local:/app/config/local:ro
    ports: ["127.0.0.1:8750:8750"]
    networks: [chainaim-test]

  console-api:
    build: { context: ., dockerfile: test-console/console.Dockerfile, labels: *source }
    image: chainaim-console:local
    container_name: ca-console-api
    labels: *source
    # The base command (paid jobs off); up.ps1 writes the full one, with the paid-job flags, in runtime/compose/commands.yml.
    command:
      - --mode=api
      - --bind=0.0.0.0
      - --port=8735
      - --gateway-key-file=/run/secrets/gateway-key
      - --run-log-dir=/runs
      - --gateway=http://gateway.railway.internal:8700
      - --paywall=http://paywall:8080
      - --analyst=http://analyst:8740
      - --chain-query=http://chain-query:8750
      - --spy=http://openrouter-stub:5004
      - --data-config=/app/config/data-sources.docker.json
      - --ledger-source=dir:/gateway-data/ledger
      - --dataset-root=private=/data/priv-ai-data/chainaim3003
      - --models-file=/app/config/local-models.cpu-all.json
    environment:
      - PAID_JOBS_KEY
      - NEAR_WATCH_INGEST_KEY
      # The receipt signing key (ARCH-614), set by up.ps1 only with receipts on; unset = not passed, receipts off.
      - RECEIPT_SIGNING_KEY
      # The AP2 quote signing key (privateAI-design-33 ARCH-628), set by up.ps1 only with -Ap2 on; unset = not passed.
      # With up.ps1 -Signer separate (privateAI-design-36 ARCH-664) neither signing key is set here: they live in
      # ca-control-signer (services/signer/compose.yml, project chainaim-control-plane) and this container gets only the
      # request key below, sent as X-Signer-Key.
      - AP2_SIGNING_KEY
      - SIGNER_REQUEST_KEY
    # ca-control-signer publishes 127.0.0.1:8780 on the host from its own project; this is how this container reaches it
    # (Docker Desktop resolves host.docker.internal itself; the mapping makes it work on Linux Docker too).
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets: [gateway-key]
    volumes:
      - ./config:/app/config:ro
      - ${SAMPLE_DATA_DIR:-./sample-data}:/app/sample-data:ro
      - ${PRIV_AI_DATA_DIR:-C:/PRIV-AI-DATA}:/data/priv-ai-data:ro
      - chainaim-test-ledger:/gateway-data:ro
      - chainaim-console-runs:/runs
      - chainaim-console-receipts:/receipts
    ports: ["127.0.0.1:8735:8735"]
    networks: [chainaim-test]
    depends_on: [gateway, analyst, chain-query]

  # Tab 03 agent mode (architecture-tab03-agent-mode.md ARCH-310): started only by up.ps1 -Agent on (profile "agent").
  # The tenants' NEAR keys are in the env file mounted read-only and read by Node's --env-file (not in the container's
  # configuration); the Bedrock key arrives by name (AWS_BEARER_TOKEN_BEDROCK, up.ps1 ARCH-311). up.ps1 writes the command.
  agent:
    profiles: [agent]
    # Context: the repository root, so the image can hold packages/agent-policy (ARCH-620); its ignore file keeps only
    # what agent.Dockerfile copies (guard: scripts/test/agent-docker.test.ts).
    build: { context: ., dockerfile: services/paywall/agent.Dockerfile, labels: *source }
    image: chainaim-agent:local
    container_name: ca-agent
    labels: *source
    environment:
      - AWS_BEARER_TOKEN_BEDROCK
    volumes:
      - ./rig/tenants:/app/rig/tenants:ro
      - chainaim-agent-spend:/data/spend
      - type: bind
        source: ${AGENT_ENV_FILE:-C:/PRIV-AI-SECRETS/agent-tenants.env}
        target: /run/secrets/agent-tenants.env
        read_only: true
    ports: ["127.0.0.1:8760:8760"]
    networks: { chainaim-test: { aliases: [agent] } }
    depends_on: [console-api, paywall, presidio]

  # NEAR AI model attestation (PLAN-private-ai-nearai-attestation.md ARCH-409/410): profile "attest". The image builds the
  # official nearai-cloud-verifier at the pinned commit with our lockfile (services/attest/Dockerfile). It reads the models
  # to attest from the gateway's generated catalog (config/generated/catalog.local.json, deployments with "attest": "nearai")
  # and calls NEAR AI (report, signature), Intel PCS and NVIDIA NRAS. Holds NEARAI_API_KEY, by name; receives ids and hashes only.
  attest:
    profiles: [attest]
    build: { context: services/attest, labels: *source }
    image: chainaim-attest:local
    container_name: ca-attest
    labels: *source
    environment:
      - NEARAI_API_KEY
    volumes:
      - ./config:/config:ro
    ports: ["127.0.0.1:8770:8770"]
    networks: { chainaim-test: { aliases: [attest] } }

  # Quote agents (privateAI-design-44 ARCH-737): Jupiter's private data plane for Signatory's quote flow (inventory,
  # logistics and treasury sub-agents over sample-data/quote, and the seller synthesis). Profile "quote": started only by
  # desk.ps1 -Quote start (docker compose --profile quote up -d --no-deps quote-agents); no other service changes.
  # Tenant tokens QUOTE_TOKEN_JUPITER / QUOTE_TOKEN_TOMMY are in the env file mounted read-only (read by Node's
  # --env-file-if-exists, never in this file); the gateway key is the existing gateway-key secret. QUOTE_AI picks the
  # synthesis: off (rules, default), nearai (NEAR AI TEE model through the gateway, attested by ca-attest) or bedrock.
  quote-agents:
    profiles: [quote]
    build: { context: ., dockerfile: services/quote-agents/Dockerfile, labels: *source }
    image: chainaim-quote-agents:local
    container_name: ca-quote-agents
    labels: *source
    command: ["--host", "0.0.0.0", "--allow-non-loopback", "--port", "8785", "--ai", "${QUOTE_AI:-off}", "--gateway-url", "http://gateway.railway.internal:8700", "--gateway-key-file", "/run/secrets/gateway-key", "--attest-url", "http://attest:8770", "--feed-url", "${QUOTE_FEED_URL:-http://near-watch:8790}"]
    # --feed-url: each answered/refused call is also sent (ids only) to the admin UI's near-watch POST /ingest/agent,
    # with NEAR_WATCH_INGEST_KEY from quote-agents.env; without that key the feed stays off (src/feed.ts).
    secrets: [gateway-key]
    volumes:
      - type: bind
        source: ${QUOTE_ENV_FILE:-C:/PRIV-AI-SECRETS/quote-agents.env}
        target: /run/secrets/quote-agents.env
        read_only: true
    ports: ["127.0.0.1:8785:8785"]
    networks: { chainaim-test: { aliases: [quote-agents] } }
