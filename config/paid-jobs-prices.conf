# Team default paid-job prices for test-console\up.ps1 (owner decision 2026-11-06: one shared set, so a fresh clone needs no
# price setup). NAME=value, not secret, committed. Not a .env file on purpose: .gitignore ignores *.env.
# Override on one PC: put your own NAME=value file at C:\PRIV-AI-SECRETS\paid-jobs-settings.env (up.ps1 -PaidJobsOverride),
# or pass up.ps1 -PaidJobsSettings <file>. server.ts itself still defaults no fee (ARCH-114): these values reach it as flags.
# PRICING_CATALOG is generated by switch-models.ps1 (config/generated/ is git-ignored): run it once on a new PC first.
PRICING_CATALOG=config/generated/catalog.local.json
FEE_PER_MODEL_CALL_USD=0.001
FEE_ANALYST_USD=0.002
NEAR_GAS_FEE_USD=0.002
MARGIN_PCT=20
MIN_PRICE_USD=0.01
