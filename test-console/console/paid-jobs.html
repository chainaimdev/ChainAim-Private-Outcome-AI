<!-- Paid jobs on tab 03 (architecture.md ARCH-112). server.ts adds this to the page only with --paid-jobs on (and
     --near-wallet); without it the page is served exactly as index.html is. Ticked, "Ask" runs the job as a paid job:
     POST /jobs/crossask runs, meters, prices and holds it and shows only the total; "Pay" pays exactly that total in
     USDC on NEAR (services/web nearPayAndRelease, through POST /paid/jobs/<id>/release, which relays to the paywall
     without the gateway key); the released result is drawn by tab 03's own renderer. The result stays in page memory.
     Agent mode (architecture-tab03-agent-mode.md ARCH-309): only when GET /agent/config answers (the console was started
     with --agent-service), "Who pays?" offers "AI agent" and a tenant picker. Then Ask posts to /agent/crossask: the
     tenant's agent runs the job, pays it from the tenant's NEAR account, and the page shows its steps live, then the
     released result in the same renderer. "Me" is the Intear flow above, unchanged.
     Estimate first (privateAI-design-34 ARCH-642, owner D4/D5): when GET /jobs/config offers both modes, "Pricing:" lets
     the buyer pick "Estimate first" (the console's default) or "Run first". Estimate first: Me posts POST /offers (a firm
     price from sizes, nothing run) and "Pay and run" pays it, the job running inside the paid release; the AI agent gets
     offerMode with its run. A console without offers (or with run-hold only) behaves exactly as before.
     Receipts (privateAI-design-32 ARCH-613/615): both paths send datasetId (the picked dataset's config id) and templateLabel
     (the picked template's label, only while the question is still that template's text) so the console's receipt names
     them; after a paid release, when GET /jobs/config says receipts are on, GET /jobs/<id>/receipt is shown with its key id
     and settlement and can be downloaded as {receipt, publicKeyPem} for any verifier (packages/receipt verifyReceipt).
     Agent receipt check (privateAI-design-32 step B): in agent mode the agent itself verifies the receipt with the console's
     PINNED public key (config/receipt-public-key.pem) after the release; its step "receipt_verified" / "receipt_failed" is
     shown, and the receipt panel says whether the agent verified it.
     Spending policy (privateAI-design-32 ARCH-620): when GET /agent/policy answers {on: true}, a read-only line under
     "Who pays?" shows the picked tenant's limits (its tenant.json "policy" block) and today's spend; the agent's "policy"
     step shows each check with its limit and the decision. Each agent step is tagged with who did it: the agent (on this
     PC, with the tenant's key), ChainAim (the console and the paywall) or NEAR (the chain).
     AP2 signed quote (privateAI-design-33 section 7, ARCH-628/630/631; only when the console runs with --ap2 on): the agent's
     step "quote_signed" (its check with the PINNED key config/ap2-public-key.jwk.json) shows between the quote and the
     policy, and a refusal shows its AP2 error code. On the Me path the page checks ap2.merchant_authorization itself
     (WebCrypto ECDSA P-256 / SHA-256, the same r||s form) with the key from this console's own /.well-known/ucp, and binds
     it to the quote shown (job, cents, amount, payee, asset, network). That proves the quote was not changed after it was
     signed, not who signed it (a page and a key from the same server), and the label says so. Pay stays disabled when the
     check fails. The receipt panel shows the quote hash the receipt carries (merchantAuthSha256), and the download adds
     the signed quote as ap2 {checkout, merchant_authorization}, so desk.ps1 -VerifyReceipt checks both. -->
<script>
(() => {
  const ask = document.getElementById("xaskGo");
  const out = document.getElementById("xaskOut");
  if (!ask || !out) return;
  const box = document.createElement("div");
  box.id = "xpayBox";
  const label = document.createElement("label");
  label.className = "paybox";
  const tick = document.createElement("input");
  tick.type = "checkbox"; tick.id = "xpayNear";
  label.append(tick, " Pay with USDC · NEAR");
  // privateAI-design-34 ARCH-642 (owner D5): how the job is priced, when /jobs/config offers both (default: its offers.mode).
  const modeBox = document.createElement("div");
  modeBox.id = "xpayMode"; modeBox.hidden = true;
  const modeChoice = (id, text) => {
    const l = document.createElement("label");
    const r = document.createElement("input");
    r.type = "radio"; r.name = "xpayMode"; r.id = id;
    l.append(r, ` ${text} `);
    return { l, r };
  };
  const estimateFirst = modeChoice("xpayModeEstimate", "Estimate first (pay before any work)");
  const runFirst = modeChoice("xpayModeRun", "Run first (ChainAim works before you agree; the result is held until you pay)");
  modeBox.append("Pricing: ", estimateFirst.l, "· ", runFirst.l);
  const info = document.createElement("span");
  info.className = "muted"; info.id = "xpayInfo";
  info.textContent = "Off: Ask runs the job free, as before.";
  const pay = document.createElement("div");
  pay.id = "xpayQuote";
  // Who pays (agent mode): built here, shown only once /agent/config has answered with at least one tenant.
  const who = document.createElement("div");
  who.id = "xpayWho"; who.hidden = true;
  const choice = (id, text, checked) => {
    const l = document.createElement("label");
    const r = document.createElement("input");
    r.type = "radio"; r.name = "xpayWho"; r.id = id; r.checked = checked;
    l.append(r, ` ${text} `);
    return { l, r };
  };
  const me = choice("xpayWhoMe", "Me — Intear Wallet", true);
  const bot = choice("xpayWhoAgent", "AI agent", false);
  const tenantPick = document.createElement("select");
  tenantPick.id = "xpayTenant"; tenantPick.disabled = true;
  who.append("Who pays? ", me.l, "· ", bot.l, tenantPick);
  // ARCH-620: the picked tenant's spending policy, read-only (set in its tenant.json, enforced by the agent service).
  const policyLine = document.createElement("div");
  policyLine.id = "xpayPolicy"; policyLine.className = "muted"; policyLine.hidden = true;
  who.append(policyLine);
  // Model attestation of the paid job (owner 2026-11-07): filled after the result is released, only with --attest-url.
  const proof = document.createElement("div");
  proof.id = "xattest";
  // Signed Job Evidence Receipt of the paid job (ARCH-615): filled after the release, only when the console has receipts on.
  const rcpt = document.createElement("div");
  rcpt.id = "xreceipt";
  // Observer view (privateAI-design-35 ARCH-650): what anyone reading NEAR learns about the job, after the release.
  const obs = document.createElement("div");
  obs.id = "xobserver";
  box.append(label, modeBox, who, info, pay, proof, rcpt, obs);
  ask.closest(".row-actions").after(box);

  let config = null;
  let agent = null;
  let policies = null;
  const agentChosen = () => agent !== null && bot.r.checked;
  const say = (text, isErr = false) => { info.textContent = text; info.className = isErr ? "err" : "muted"; };
  const tenantOf = () => agent.tenants.find((t) => t.id === tenantPick.value);
  const usd = (v) => `${Number(v)} USDC`;
  /** The read-only policy line for the picked tenant; hidden when the agent runs without a policy or "Me" pays. */
  const showPolicy = () => {
    const p = agentChosen() && policies ? policies.find((x) => x.id === tenantPick.value) : undefined;
    policyLine.hidden = !p;
    if (!p) return;
    policyLine.textContent = p.error
      ? `Spending policy for ${p.id}: ${p.error}`
      : `Spending policy for ${p.id} (its tenant.json, enforced by the agent): pays by itself up to ${usd(p.autoApproveMaxUsd)} a job · never above ${usd(p.maxPerJobUsd)} a job · ${usd(p.dailyCapUsd)} a day (${usd(p.spentTodayUsd)} spent today, UTC)${p.requireAttestedRoute ? " · attested NEAR AI route only" : ""}`;
  };
  const loadPolicy = () => fetch("/agent/policy").then(async (r) => {
    const j = r.ok ? await r.json() : null;
    policies = j && j.on === true && Array.isArray(j.tenants) ? j.tenants : null;
    showPolicy();
  }).catch(() => { policies = null; showPolicy(); });
  /** The pricing mode: estimate-first only when this console offers it (/jobs/config offers.modes); otherwise run-hold, as before. */
  const modeChosen = () => {
    const modes = config && config.offers && Array.isArray(config.offers.modes) ? config.offers.modes : ["run-hold"];
    if (!modes.includes("estimate-first")) return "run-hold";
    if (!modes.includes("run-hold")) return "estimate-first";
    return runFirst.r.checked ? "run-hold" : "estimate-first";
  };
  const showModes = () => {
    const modes = config && config.offers && Array.isArray(config.offers.modes) ? config.offers.modes : ["run-hold"];
    modeBox.hidden = !tick.checked || !(modes.includes("estimate-first") && modes.includes("run-hold"));
    if (!estimateFirst.r.checked && !runFirst.r.checked) { const first = config && config.offers && config.offers.mode === "estimate-first"; estimateFirst.r.checked = first; runFirst.r.checked = !first; }
  };
  const explain = () => {
    if (!tick.checked || !config) return;
    showModes();
    showPolicy();
    if (modeChosen() === "estimate-first") {
      if (agentChosen()) { const t = tenantOf(); say(`On, AI agent, estimate first: ChainAim prices the job from its sizes and does no work; the agent for ${t.name} checks the signed estimate and its policy, pays from ${t.accountId}, and only then does the job run. A run that fails is never charged.`); return; }
      say(`On, estimate first: Ask shows a firm price from the job's sizes; nothing has run yet. Press Pay in ${config.walletName} and the job runs then; a run that fails is never charged. An estimate stays payable ${config.ttlMin} minutes.`);
      return;
    }
    if (agentChosen()) { const t = tenantOf(); say(`On, AI agent: Ask runs the job, and the agent for ${t.name} pays its total from ${t.accountId} by itself (no pop-up); its steps show below, then the result.`); return; }
    say(`On: Ask runs the job and shows its total; nothing is shown or charged until you press Pay in ${config.walletName}. A quote stays payable ${config.ttlMin} minutes.`);
  };
  tick.onchange = async () => {
    pay.replaceChildren();
    who.hidden = !tick.checked || agent === null;
    if (!tick.checked) { modeBox.hidden = true; say("Off: Ask runs the job free, as before."); return; }
    try {
      const r = await fetch("/jobs/config");
      config = await r.json();
      if (!r.ok) throw new Error(config.error ?? `HTTP ${r.status}`);
      me.l.lastChild.textContent = ` Me — ${config.walletName} `;
      explain();
    } catch (e) { config = null; say(e.message, true); }
  };
  for (const r of [me.r, bot.r]) r.onchange = () => { tenantPick.disabled = !bot.r.checked; pay.replaceChildren(); explain(); };
  for (const r of [estimateFirst.r, runFirst.r]) r.onchange = () => { pay.replaceChildren(); explain(); };
  tenantPick.onchange = explain;
  // The agent's tenants, when the console relays to an agent service; without one, /agent/config is 404 and nothing changes.
  fetch("/agent/config").then(async (r) => {
    if (!r.ok) return;
    const j = await r.json();
    if (!Array.isArray(j.tenants) || j.tenants.length === 0) return;
    agent = j;
    tenantPick.replaceChildren(...j.tenants.map((t) => { const o = document.createElement("option"); o.value = t.id; o.textContent = `${t.id} · ${t.accountId}`; return o; }));
    void loadPolicy();
    who.hidden = !tick.checked;
    // --default-payer agent (owner 2026-11-07): the box starts ticked with the AI agent paying; Me stays one click away.
    const c = await fetch("/jobs/config").then((x) => (x.ok ? x.json() : null)).catch(() => null);
    if (c && c.defaultPayer === "agent") {
      tick.checked = true; bot.r.checked = true; me.r.checked = false; tenantPick.disabled = false;
      await tick.onchange();
    }
  }).catch((e) => console.info("[tab 03] agent mode is not available:", e.message));
  // The browser can restore the box as ticked when the page is reloaded: load the wallet config then too, not only on a click.
  if (tick.checked) tick.onchange();
  window.addEventListener("pageshow", () => { if (tick.checked && !config) tick.onchange(); });

  // The receipt is built just after the release (never awaited by it), so the page asks a few times before giving up.
  const RECEIPT_POLL_MS = 1000, RECEIPT_POLL_MAX = 15;
  const DATASET_ID = /^[A-Za-z0-9_.-]{1,64}$/, TEMPLATE_LABEL = /^[\x20-\x7E]{1,120}$/;
  /**
   * Tab 03's request plus what the receipt names (ARCH-613): datasetId = the picked dataset's id in config/datasets.json
   * (index.html's ds.cur); templateLabel = the picked template's label, only while the question is still exactly that
   * template's text (its button title), so an edited question is never labelled as a template. Same shapes the console
   * accepts (receipt.ts datasetIdOf / templateLabelOf); anything else is left out and the console uses a folder hash.
   */
  const withReceiptFields = (body) => {
    const extra = {};
    const cur = typeof ds !== "undefined" ? ds.cur : undefined;
    // Only while the asked folder is the picked dataset's folder (or a set inside it): a folder browsed to by hand is not
    // that dataset, so it gets no id and the console names it by a folder hash. Paths are compared as "/"-separated,
    // lower case, segment by segment, so a relative config folder matches its resolved form.
    const norm = (p) => String(p).replace(/\\/g, "/").replace(/^\.\//, "").replace(/\/+$/, "").toLowerCase();
    const inside = cur && typeof cur.folder === "string" && cur.folder && typeof body.folder === "string" &&
      ("/" + norm(body.folder) + "/").includes("/" + norm(cur.folder) + "/");
    if (inside && typeof cur.id === "string" && DATASET_ID.test(cur.id)) extra.datasetId = cur.id;
    const on = typeof document.querySelector === "function" ? document.querySelector("#xTemplates .tpl-group button.on") : null;
    const lbl = on ? on.textContent.trim() : "";
    if (on && on.title === body.question && TEMPLATE_LABEL.test(lbl)) extra.templateLabel = lbl;
    return { ...body, ...extra };
  };

  /** The signed receipt of a released job: key id, settlement, and a download of {receipt, publicKeyPem}. */
  function receiptPanel(jobId, agentCheck) {
    rcpt.replaceChildren();
    if (!config || config.receipts !== true || !/^[0-9a-f]{32}$/.test(jobId)) return;
    const head = document.createElement("p"); head.className = "muted"; head.id = "xreceiptHead";
    head.textContent = "Signed receipt: being made…";
    rcpt.append(head);
    let n = 0;
    const ask = async () => {
      n++;
      let j = null;
      try { const r = await fetch(`/jobs/${jobId}/receipt`); j = r.ok ? await r.json() : null; } catch { j = null; }
      const r = j && j.receipt;
      if (!r || !r.body || !r.sig || typeof j.publicKeyPem !== "string") {
        if (n < RECEIPT_POLL_MAX) { setTimeout(ask, RECEIPT_POLL_MS); return; }
        head.className = "err"; head.textContent = "Signed receipt: not available (the console log names the reason as job_receipt_failed).";
        return;
      }
      const settled = r.settlement ? `settled on ${r.settlement.network}, transaction ${String(r.settlement.transaction).slice(0, 8)}…` : "settlement not attached yet";
      // Step B: what the paying agent found with its pinned key (agent mode only; the Me path passes nothing).
      const byAgent = !agentCheck ? "" : agentCheck.ok ? ` · verified by ${agentCheck.who} ✓` : ` · ${agentCheck.who}'s check failed ✗`;
      // ARCH-631: the signed quote the receipt points at (--ap2 on only).
      const quoteHash = typeof r.body.merchantAuthSha256 === "string" ? ` · quote ${r.body.merchantAuthSha256.slice(0, 8)}…` : "";
      head.textContent = `Signed receipt ✓ · ${r.body.datasetId}${r.body.templateLabel ? ` · "${r.body.templateLabel}"` : ""} · ${settled} · key id ${r.sig.keyId}${quoteHash}${byAgent}`;
      head.title = "Signed by this console. It holds hashes of the files, query, result and model calls, never the question, rows or answer.";
      const dl = document.createElement("button");
      dl.type = "button"; dl.className = "ghost"; dl.id = "xreceiptGo"; dl.textContent = "Download receipt";
      dl.onclick = () => {
        const blob = new Blob([JSON.stringify({ receipt: r, publicKeyPem: j.publicKeyPem, ...(j.ap2 ? { ap2: j.ap2 } : {}) }, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = `chainaim-receipt-${jobId}.json`;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      rcpt.append(dl);
    };
    ask();
  }

  /**
   * ARCH-650: the payment's public footprint. The line says the limit plainly; the button asks GET /jobs/<id>/observer,
   * which reads the settlement transaction from public NEAR RPC (as anyone could) and lists what the chain does not carry.
   */
  const OBSERVER_LINE = "Your content stays private: it was de-identified before any model saw it, every NEAR AI call is attested, and nothing about it goes on chain. Only the payment is on NEAR, like any transfer: who paid, how much and when.";
  function observerPanel(jobId) {
    obs.replaceChildren();
    if (!config || config.observer !== true || !/^[0-9a-f]{32}$/.test(jobId)) return;
    const line = document.createElement("p"); line.className = "muted"; line.id = "xobserverLine";
    line.textContent = OBSERVER_LINE;
    const go = document.createElement("button");
    go.type = "button"; go.className = "ghost"; go.id = "xobserverGo"; go.textContent = "What the chain shows";
    const out = document.createElement("div"); out.id = "xobserverOut";
    obs.append(line, go, out);
    let n = 0;
    const show = (v) => {
      const t = document.createElement("table"); t.className = "kv result-kv observer";
      const row = (k, ...cells) => { const tr = document.createElement("tr"); const th = document.createElement("th"); th.textContent = k; const td = document.createElement("td"); td.append(...cells); tr.append(th, td); t.append(tr); };
      row("Paid by", v.payer);
      if (v.relayer) row("Sent by (relayer, pays the gas)", v.relayer);
      row("Paid to", v.payTo);
      row("Amount", `${v.amount} USDC${v.succeeded ? "" : " (the transfer FAILED on chain)"}`);
      row("When", v.blockTime ? `${v.blockTime}${v.blockHeight !== null ? ` · block ${v.blockHeight}` : ""}` : "not given by the RPC node (see the explorer)");
      row("Token contract", v.token);
      if (v.memo) row("Memo", v.memo);
      row("Transaction", explorerLink(v.network, v.transaction));
      const not = document.createElement("p"); not.className = "muted";
      not.textContent = `Not on the chain: ${v.notOnChain.join("; ")}. Read from ${new URL(v.rpcUrl).host}, a public NEAR RPC, with no ChainAim key.`;
      out.replaceChildren(t, not);
    };
    const ask = async () => {
      n++;
      go.disabled = true; out.replaceChildren("Reading the transaction from public NEAR RPC…");
      let r = null, j = null;
      try { r = await fetch(`/jobs/${jobId}/observer`); j = await r.json(); } catch { j = null; }
      if (r && r.ok && j && typeof j.payer === "string") { go.disabled = false; show(j); return; }
      // 404/409 right after the release: the receipt or its settlement is still being attached.
      if (r && (r.status === 404 || r.status === 409) && n < RECEIPT_POLL_MAX) { setTimeout(ask, RECEIPT_POLL_MS); return; }
      go.disabled = false;
      const e = document.createElement("p"); e.className = "err";
      e.textContent = `Could not read the chain: ${(j && j.error) || (r ? `HTTP ${r.status}` : "the console did not answer")}`;
      out.replaceChildren(e);
    };
    go.onclick = () => { n = 0; ask(); };
  }

  const explorerLink = (network, transaction) => {
    const link = document.createElement("a");
    link.href = `https://${network === "near:mainnet" ? "" : "testnet."}nearblocks.io/txns/${transaction}`;
    link.target = "_blank"; link.rel = "noopener";
    link.textContent = `${transaction.slice(0, 8)}…${transaction.slice(-6)} ↗`;
    return link;
  };

  // ---- AP2 signed quote, Me path (design-33 section 7): checked in the browser before Pay is enabled ----
  const b64uBytes = (s) => Uint8Array.from(atob(String(s).replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(s).length + 3) % 4)), (c) => c.charCodeAt(0));
  const b64uOf = (str) => { let bin = ""; for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  /** JCS (RFC 8785) for the JSON values a checkout holds: keys sorted by UTF-16 code units, ECMAScript number and string form (packages/ap2 jcs). */
  const jcs = (v) => v === null || typeof v !== "object" ? JSON.stringify(v)
    : Array.isArray(v) ? `[${v.map(jcs).join(",")}]`
    : `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => `${JSON.stringify(k)}:${jcs(v[k])}`).join(",")}}`;
  /**
   * The quote's AP2 merchant authorization, verified with the key of this console's /.well-known/ucp and bound to the quote
   * shown. null when the quote carries no ap2 (the console runs with --ap2 off); else {ok, kid} or {ok: false, reason}.
   */
  async function checkSignedQuote(job) {
    const a = job.ap2;
    if (!a) return null;
    const no = (reason) => ({ ok: false, reason });
    try {
      if (typeof crypto === "undefined" || !crypto.subtle) return no("this browser offers no WebCrypto here (open the console as http://127.0.0.1)");
      const m = /^([A-Za-z0-9_-]+)\.\.([A-Za-z0-9_-]+)$/.exec(String(a.merchant_authorization ?? ""));
      if (!m || !a.checkout || typeof a.checkout !== "object") return no("the quote has no detached JWS merchant_authorization");
      const header = JSON.parse(new TextDecoder().decode(b64uBytes(m[1])));
      if (header.alg !== "ES256" || typeof header.kid !== "string" || Object.keys(header).length !== 2) return no("the JWS header must be exactly {alg: ES256, kid}");
      const r = await fetch("/.well-known/ucp");
      const prof = r.ok ? await r.json() : null;
      const jwk = Array.isArray(prof?.keys) ? prof.keys.find((k) => k && k.kid === header.kid) : undefined;
      if (!jwk) return no(`this console's /.well-known/ucp has no key ${header.kid}`);
      const key = await crypto.subtle.importKey("jwk", { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y }, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
      const { ap2: _ap2, ...payload } = a.checkout;
      const signedBytes = new TextEncoder().encode(`${m[1]}.${b64uOf(jcs(payload))}`);
      if (!(await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, b64uBytes(m[2]), signedBytes))) return no("the signature does not verify over this quote");
      const ck = a.checkout, ext = ck["dev.chainaim.job"] ?? {};
      const total = Array.isArray(ck.totals) ? ck.totals.filter((t) => t && t.type === "total") : [];
      if (ck.id !== job.jobId) return no("the signed quote is for another job");
      if (ck.currency !== "USD" || total.length !== 1 || !Number.isInteger(total[0].amount) || !Number.isInteger(ext.usdcDecimals) || ext.usdcDecimals < 2) return no("the signed quote has no single whole-cent USD total");
      if (BigInt(total[0].amount) * 10n ** BigInt(ext.usdcDecimals - 2) !== BigInt(job.amount) || ext.amountUnits !== job.amount) return no("the signed price is not the price shown");
      if (ext.payTo !== job.payTo || ext.asset !== job.asset || ext.network !== job.network) return no("the signed payee, asset or network is not the one shown");
      return { ok: true, kid: header.kid };
    } catch (e) { return no(e && e.message ? e.message : String(e)); }
  }

  /** Agent mode: one run (agentRun), then the policy line is read again, since today's spend may have changed (ARCH-620). */
  async function agentStep(body) {
    try { return await agentRun(body); }
    // A run that stopped (refused, error): the status line goes back to what Ask does now, not "...is running and paying".
    catch (e) { explain(); throw e; }
    finally { if (policies) void loadPolicy(); }
  }

  /** Agent mode: the run's steps as they arrive, then the released result; rejects with one plain sentence. */
  async function agentRun(body) {
    const t = tenantOf();
    const steps = document.createElement("ol");
    steps.id = "xagentSteps";
    pay.replaceChildren(steps);
    const step = (...parts) => { const li = document.createElement("li"); li.append(...parts); steps.append(li); };
    // Who did each step: the agent (this PC, the tenant's key), ChainAim (console + paywall) or NEAR (the chain).
    const by = (actor) => { const s = document.createElement("span"); s.className = "actor"; s.textContent = `[${actor}] `; return s; };
    const AGENT = `Agent ${t.id}`;
    const CHECK = { not_expired: (c) => "quote still valid", attested_route: (c) => "attested route", max_per_job: (c) => `at most ${c.limit} a job (quote ${c.value})`,
      daily_cap: (c) => `${c.limit} a day (with this job ${c.value})`, auto_approve: (c) => `pays by itself up to ${c.limit}` };
    say(`The AI agent for ${t.name} is running and paying the job…`);
    const r = await fetch("/agent/crossask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...body, tenant: t.id, offerMode: modeChosen() }) });
    if (!r.ok || !/^text\/event-stream/i.test(r.headers.get("content-type") ?? "")) {
      const j = await r.json().catch(() => ({}));
      throw new Error((typeof j.error === "string" ? j.error : j.error?.message) ?? `HTTP ${r.status}`);
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", result, quoted = null, settled = null, ranJob = null, receiptCheck = null;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      for (let at = buffer.indexOf("\n\n"); at >= 0; at = buffer.indexOf("\n\n")) {
        const frame = buffer.slice(0, at);
        buffer = buffer.slice(at + 2);
        const type = /^event: (.+)$/m.exec(frame)?.[1];
        let d;
        try { d = JSON.parse(/^data: (.*)$/m.exec(frame)?.[1] ?? "{}"); } catch { d = {}; }
        if (type === "masked") {
          const found = Object.entries(d.counts ?? {});
          step(by(AGENT), found.length ? `Question masked on this PC before the agent's model saw it: ${found.map(([k, n]) => `${k} ×${n}`).join(", ")}` : "Question checked on this PC before the agent's model saw it: nothing to mask");
        } else if (type === "tool_called") step(by(AGENT), "The agent asked ChainAim to run the job");
        else if (type === "job_ran" && (ranJob = /^[0-9a-f]{32}$/.test(String(d.jobId)) ? String(d.jobId) : null, true)) step(by("ChainAim"), `Job run and held (id ${String(d.jobId).slice(0, 8)}…); the result stays hidden until paid`);
        else if (type === "estimated" && (ranJob = /^[0-9a-f]{32}$/.test(String(d.jobId)) ? String(d.jobId) : null, true)) step(by("ChainAim"), `Estimated from the job's sizes (id ${String(d.jobId).slice(0, 8)}…): nothing has run yet; it runs only after the payment`);
        else if (type === "quoted") { quoted = d; step(by("ChainAim"), `Quoted ${Number(d.totalUsd)} USDC on ${d.network} to ${d.payTo}`); }
        else if (type === "quote_signed") step(by(AGENT), `Quote signed by ChainAim ✓ · key id ${String(d.kid).slice(0, 8)}… · price, payee and network match`);
        else if (type === "policy") {
          const checks = Array.isArray(d.checks) ? d.checks.filter((c) => CHECK[c.check]).map((c) => `${CHECK[c.check](c)} ${c.ok ? "✓" : "✗"}`) : [];
          step(by(AGENT), `Spending policy: ${d.decision === "pay" ? "pay ✓" : d.decision === "refuse" ? "refused ✗" : `${d.decision} ✗`} · ${checks.join(" · ")}`);
        }
        else if (type === "signed") step(by(AGENT), `Payment signed by ${d.account} (ChainAim's relayer pays the gas)`);
        else if (type === "settled") { settled = d; step(by("NEAR"), "Settled on NEAR · ", explorerLink(d.network, d.transaction)); }
        else if (type === "released") { result = d.result; step(by("ChainAim"), `Result released: ${d.rows} row(s)`); }
        else if (type === "receipt_verified") {
          receiptCheck = { ok: true, who: `Agent ${t.id}` };
          step(by(AGENT), `Agent verified the receipt ✓ · signed by the pinned key ${String(d.keyId).slice(0, 8)}… · result, job and amount${d.settled ? " and transaction" : ""} match${d.settled ? "" : " (settlement not attached yet)"}`);
        }
        else if (type === "receipt_failed") {
          receiptCheck = { ok: false, who: `Agent ${t.id}` };
          step(by(AGENT), `Receipt check failed ✗: ${d.reason} (the payment stands)`);
        }
        else if (type === "done") step("Done");
        else if (type === "refused") throw new Error(`Not paid${typeof d.code === "string" ? ` [${d.code}]` : ""}: ${d.reason}`);
        else if (type === "error") throw new Error(`${d.reason}${d.transaction ? ` (transaction ${d.transaction})` : ""}`);
      }
    }
    if (result !== undefined && settled && ranJob) attestPanel(ranJob);
    if (result !== undefined && settled && ranJob) receiptPanel(ranJob, receiptCheck);
    if (result !== undefined && settled && ranJob) observerPanel(ranJob);
    if (result === undefined || !settled) throw new Error(`The agent's steps ended before the result arrived${settled ? ` (transaction ${settled.transaction}: it was paid)` : ""}.`);
    info.replaceChildren(`Paid ${Number(quoted?.totalUsd)} USDC by the AI agent from ${t.accountId} on ${settled.network} · transaction `, explorerLink(settled.network, settled.transaction));
    info.className = "muted";
    return result;
  }

  /**
   * AI proof of a paid job: GET /jobs/<id>/attestation (the console asks ca-attest in the background after the quote, so
   * the page asks again every attest.pollMs, at most attest.pollMax times, until the verdict is final). Plain words first;
   * the checks, signer, chat id and signed text sit under "Show proof". Covers the masked text the gateway sent, not the
   * buyer's original, and not whether the answer is right (that is the figure check).
   */
  function attestPanel(jobId) {
    proof.replaceChildren();
    if (!config || !config.attest || !/^[0-9a-f]{32}$/.test(jobId)) return;
    const head = document.createElement("p"); head.className = "muted"; head.textContent = "AI proof: checking the model calls…";
    const list = document.createElement("ul");
    proof.append(head, list);
    const tick3 = (v) => (v === true ? "✓" : v === false ? "✗" : "not checked");
    const callLine = (c) => {
      const li = document.createElement("li");
      const who = `Call ${c.index + 1} · ${c.model ?? c.servedModel ?? "model"}: `;
      const text = c.status === "verified" ? "✓ verified on NEAR AI's sealed hardware (Intel TDX enclave, NVIDIA GPU)"
        : c.status === "not_applicable" ? "not attestable (this provider gives no enclave proof)"
        : c.status === "unavailable" ? (c.reason === "checking" ? "checking…" : `not ready yet: ${c.reason ?? "no evidence"}`)
        : `✗ not verified: ${c.reason ?? "no reason given"}`;
      li.textContent = who + text;
      li.className = c.status === "verified" ? "" : c.status === "unverified" ? "err" : "muted";
      if (c.status === "verified" || c.status === "unverified") {
        const d = document.createElement("details");
        const s = document.createElement("summary"); s.className = "muted"; s.textContent = "Show proof";
        const rows = [
          ["Genuine Intel TDX enclave", tick3(c.tdx)],
          ["Genuine NVIDIA GPU in confidential mode", tick3(c.gpu)],
          ["Answer signed inside the enclave", tick3(c.signature)],
          ["Signed bytes match what ChainAim sent and received", tick3(c.hashes)],
          ["Signature kind", c.signatureKind ?? "—"],
          ["Enclave signing key", c.signingAddress ? `${c.signingAddress} (${c.signingAlgo ?? "?"})` : "—"],
          ["Enclave report checked", c.reportFetchedAt ? new Date(c.reportFetchedAt).toLocaleString() : "—"],
          ["NEAR AI chat id", c.chatId ?? "—"],
          ["Signed text", c.signedText ?? "—"],
        ];
        const t = document.createElement("table");
        for (const [k, v] of rows) { const tr = t.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; }
        // NEAR AI's Verification Center takes ?model=<NEAR model id> for a model's enclave attestation (the page's own text,
        // 2026-11-07; docs.near.ai/cloud/verification). The NEAR model id is the signed text's first field (<model>:<reqSHA256>:<respSHA256>).
        // A reply's own receipt is passed in the URL fragment in a format not published where we could read it, so it is not sent.
        const nearModel = typeof c.signedText === "string" && c.signedText.includes(":") ? c.signedText.slice(0, c.signedText.indexOf(":")) : null;
        const a = document.createElement("a"); a.target = "_blank"; a.rel = "noopener";
        a.href = nearModel ? `https://cloud.near.ai/verify?model=${encodeURIComponent(nearModel)}` : "https://cloud.near.ai/verify";
        a.textContent = nearModel ? `Check ${nearModel}'s enclave on NEAR AI's Verification Center ↗` : "NEAR AI's Verification Center ↗";
        d.append(s, t, a);
        li.append(d);
      }
      return li;
    };
    let n = 0;
    const ask = async () => {
      n++;
      let a = null;
      try { const r = await fetch(`/jobs/${jobId}/attestation`); a = r.ok ? await r.json() : null; } catch { a = null; }
      if (a && Array.isArray(a.calls)) {
        list.replaceChildren(...a.calls.map(callLine));
        const verified = a.calls.filter((c) => c.status === "verified").length, attestable = a.calls.filter((c) => c.status !== "not_applicable").length;
        head.className = a.summary === "unverified" ? "err" : "muted";
        head.textContent = a.summary === "verified" ? `AI proof: ✓ ${verified} of ${attestable} NEAR AI call(s) verified. The masked data sent to the model and its answer were processed and signed inside a hardware-sealed enclave; nobody in between could read or change them. (Covers what the gateway sent after masking; correctness is the figure check above.)`
          : a.summary === "partly" ? `AI proof: ${verified} of ${attestable} NEAR AI call(s) verified; see each call below.`
          : a.summary === "unverified" ? "AI proof: ✗ the NEAR AI call could not be verified; see the reason below."
          : a.summary === "not_applicable" ? "AI proof: none of this job's models can be attested (only NEAR AI gives enclave proof)."
          : a.summary === "unavailable" ? "AI proof: the evidence was not ready; the NEAR admin UI's Jobs tab shows any later re-check."
          : "AI proof: checking the model calls…";
        if (a.summary !== "pending") return;
      }
      if (n < config.attest.pollMax) setTimeout(ask, config.attest.pollMs);
      else if (!a || a.summary === "pending") head.textContent = "AI proof: still checking; the NEAR admin UI's Jobs tab will show the result.";
    };
    ask();
  }

  /** Shows the total and a Pay button; resolves with the released result, or rejects with one plain sentence. */
  function payStep(job) {
    return new Promise((resolve, reject) => {
      const total = document.createElement("p");
      total.id = "xpayTotal";
      const estimated = job.mode === "estimate-first";
      total.textContent = estimated
        ? `Price ${Number(job.totalUsd)} USDC, estimated before any work (${job.basis ? `${job.basis.files} file(s), at most ${job.basis.modelCalls} model call(s)` : "from the job's sizes"}; expires ${new Date(job.expiresAt).toLocaleTimeString()}) · ${job.network} · to ${job.payTo}. Nothing has run yet: the job runs when you pay, and a run that fails is not charged.`
        : `Total cost ${Number(job.totalUsd)} USDC (expires ${new Date(job.expiresAt).toLocaleTimeString()}) · ${job.network} · to ${job.payTo}`;
      const button = document.createElement("button");
      button.type = "button"; button.id = "xpayGo"; button.textContent = estimated ? "Pay and run" : "Pay";
      const cancel = document.createElement("button");
      cancel.type = "button"; cancel.className = "ghost"; cancel.textContent = "Don't pay";
      pay.replaceChildren(total, button, cancel);
      // AP2 (design-33 section 7): with a signed quote, Pay waits for the browser's check and stays disabled if it fails.
      if (job.ap2) {
        const signedLine = document.createElement("p");
        signedLine.id = "xpaySigned"; signedLine.className = "muted";
        signedLine.textContent = "Signed quote: checking…";
        total.after(signedLine);
        button.disabled = true;
        void checkSignedQuote(job).then((v) => {
          if (v && v.ok) {
            signedLine.textContent = `Signed quote ✓ (key id ${v.kid.slice(0, 8)}…) · checked in this browser with this console's own /.well-known/ucp key: the price, payee and network were not changed after signing (it does not prove who runs this console; the AI agent checks against its own pinned key)`;
            if (!cancel.disabled) button.disabled = false;
          } else {
            signedLine.className = "err";
            signedLine.textContent = `Signed quote ✗: ${v ? v.reason : "no signed quote"}. Pay is disabled.`;
          }
        });
      }
      cancel.onclick = () => { pay.replaceChildren(); reject(new Error("Not paid: the result stays hidden and the quote expires on its own.")); };
      button.onclick = async () => {
        button.disabled = true; cancel.disabled = true;
        try {
          const w = await nearWallet();
          const saved = w.nearSavedAccount();
          let payer = saved && saved.caip2 === job.network && saved.wallet === config.wallet ? saved.accountId : null;
          if (!payer) { say(`Connecting ${config.walletName}…`); payer = await w.nearConnect(config.wallet, job.network); }
          say(`Approve the payment of ${Number(job.totalUsd)} USDC in ${config.walletName}…`);
          const quote = { network: job.network, asset: job.asset, payTo: job.payTo, amount: job.amount };
          const r = await w.nearPayAndRelease(payer, config.wallet, quote, `/paid/jobs/${job.jobId}/release`, () => say(estimated ? "Payment signed: the job is running now, then the payment settles…" : "Payment signed, waiting for the result…"));
          pay.replaceChildren();
          if (r.error) { reject(new Error(r.error + (r.transaction ? ` (transaction ${r.transaction})` : ""))); return; }
          const explorer = `https://${job.network === "near:mainnet" ? "" : "testnet."}nearblocks.io/txns/${r.transaction}`;
          const link = document.createElement("a");
          link.href = explorer; link.target = "_blank"; link.rel = "noopener";
          link.textContent = `${r.transaction.slice(0, 8)}…${r.transaction.slice(-6)} ↗`;
          info.replaceChildren(`Paid ${Number(job.totalUsd)} USDC on ${job.network} · transaction `, link);
          info.className = "muted";
          attestPanel(job.jobId);
          receiptPanel(job.jobId);
          observerPanel(job.jobId);
          resolve(r.result);
        } catch (e) { pay.replaceChildren(); reject(e); }
      };
    });
  }

  // Ticked: tab 03's own Ask flow gets the released result in place of the free one, and draws it as usual.
  const free = postData;
  postData = async (url, body) => {
    if (url !== "/crossask" || !tick.checked) return free(url, body);
    pay.replaceChildren(); proof.replaceChildren(); rcpt.replaceChildren(); obs.replaceChildren();
    const sent = withReceiptFields(body);
    if (agentChosen()) return agentStep(sent);
    const job = await free(modeChosen() === "estimate-first" ? "/offers" : "/jobs/crossask", sent);
    return payStep(job);
  };
})();
</script>
